<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0284c7" />
    <meta name="description" content="منصة تعليمية مفتوحة المصدر ومجانية 100% للشباب التونسي — دروس برمجية، ذكاء اصطناعي، ومحتوى تدريبي مجاني بدون أي تكلفة" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Google Fonts: Plus Jakarta Sans + Tajawal & Cairo for Arabic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    
    <title>درس — Dars | منصة التعليم المفتوح للمجتمع التونسي</title>
  </head>
  <body class="bg-[#f8fafc] text-[#0f172a] antialiased selection:bg-sky-100 selection:text-sky-800">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register PWA Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            reg => console.log('Dars PWA ServiceWorker registered with scope:', reg.scope),
            err => console.log('Dars PWA ServiceWorker registration failed:', err)
          );
        });
      }
    </script>
  </body>
</html>
